function ptpCalc(nodeErrs,asym){
  var worst=0,sumSq=0;
  for(var i=0;i<nodeErrs.length;i++){
    worst+=nodeErrs[i]+asym;
    sumSq+=nodeErrs[i]*nodeErrs[i];
  }
  return {worstCase:worst,rms:Math.sqrt(sumSq)};

function ptpCheck(value,budget){

function initPTP(){

    rows.push(["Timestamp granularity",ns(gran)+" ns"]);
    rows.push(["Effective node error (TE<sub>max</sub> + granularity)",ns(nodeErr)+" ns"]);
    rows.push(["Link asymmetry per hop",ns(asym)+" ns"]);
    rows.push(["Per-hop worst-case contribution",ns(perHop)+" ns"]);
    rows.push(["Worst-case total (N × per-hop)",ns(r.worstCase)+" ns"]);
    rows.push(["RMS total (asymmetry excluded)",ns(r.rms)+" ns"]);
    rows.push(["Budget",ns(budget)+" ns"]);
    rows.push(["Worst-case vs budget",wc.pass?("PASS — "+ns(wc.diff)+" ns margin"):("FAIL — "+ns(wc.diff)+" ns over")]);
    rows.push(["RMS vs budget",rc.pass?("PASS — "+ns(rc.diff)+" ns margin"):("FAIL — "+ns(rc.diff)+" ns over")]);
    $("#pp-out").innerHTML=rows.map(function(x){return "<dt>"+x[0]+"</dt><dd>"+x[1]+"</dd>";}).join("");
    $("#pp-verdict").innerHTML=verdict("worst case",r.worstCase,budget)+verdict("RMS",r.rms,budget);
    var trs="",runTot=0,j;
    for(j=0;j<n;j++){ runTot+=perHop; trs+='<tr><td class="num">'+(j+1)+'</td><td class="num">'+ns(nodeErr)+'</td><td class="num">'+ns(asym)+'</td><td class="num">'+ns(runTot)+'</td></tr>'; }
    $("#pp-rows").innerHTML=trs;
  }
  $("#pp-preset").addEventListener("change",function(){
    var s=$("#pp-preset"),o=s.options[s.selectedIndex],b=o.getAttribute("data-budget");
    if(b!==null&&b!==undefined) $("#pp-budget").value=b;
    run();
  });
  $("#pp-budget").addEventListener("input",function(){
    var s=$("#pp-preset"),o=s.options[s.selectedIndex],b=o.getAttribute("data-budget");
    if(b!==null&&b!==undefined&&v("pp-budget")!==parseFloat(b)) s.value="custom";
    run();
  });
  ["pp-n","pp-te","pp-gran","pp-asym"].forEach(function(id){ $("#"+id).addEventListener("input",run); });
  run();
}


pagePTP();
</script>
</body>
</html>
