function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function mulberry32(seed){
  var a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)|0;
    var t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
/* FNV-1a 32-bit with a seeded init, finished with the MurmurHash3 fmix32
   avalanche — raw FNV-1a low bits do not avalanche seed differences, so
   without fmix32 the "varied seeds" mode below could not decorrelate. */
function ecmpHash(bytes,seed){
  var h=(2166136261^seed)>>>0;
  for(var i=0;i<bytes.length;i++){ h^=bytes[i]; h=Math.imul(h,16777619); }
  h^=h>>>16; h=Math.imul(h,0x85ebca6b); h^=h>>>13; h=Math.imul(h,0xc2b2ae35); h^=h>>>16;
  return h>>>0;
}
/* Simulate N random flows through a two-stage Clos fabric.
   Stage 1 (leaf→spine): link1 = hash % S. Stage 2 (spine→leaf): identical-seed
   mode reuses the same hash (% L, correlated); varied-seed mode hashes again
   with an independent seed. Returns the S×L joint matrix and stats. */
function ecmpSim(S,L,N,varied,flowSeed){
  var SEED_A=0x1F123BB5, SEED_B=0x5BD1E995;
  var rng=mulberry32(flowSeed);
  var matrix=[],stage2=[],i,j;
  for(i=0;i<S;i++){ matrix.push([]); for(j=0;j<L;j++) matrix[i].push(0); }
  for(j=0;j<L;j++) stage2.push(0);
  var b=new Uint8Array(13);
  for(var f=0;f<N;f++){
    var src=(rng()*4294967296)>>>0, dst=(rng()*4294967296)>>>0;
    var sp=Math.floor(rng()*65536), dp=Math.floor(rng()*65536);
    var proto=rng()<0.5?6:17;
    b[0]=(src>>>24)&255; b[1]=(src>>>16)&255; b[2]=(src>>>8)&255; b[3]=src&255;
    b[4]=(dst>>>24)&255; b[5]=(dst>>>16)&255; b[6]=(dst>>>8)&255; b[7]=dst&255;
    b[8]=(sp>>>8)&255; b[9]=sp&255; b[10]=(dp>>>8)&255; b[11]=dp&255; b[12]=proto;
    var hA=ecmpHash(b,SEED_A);
    var i1=hA%S;
    var i2=varied?(ecmpHash(b,SEED_B)%L):(hA%L);
    stage2[i2]++; matrix[i1][i2]++;
  }
  var mean=N/(S*L), max=0, total=0, hi=0, hj=0, diag=0;
  for(i=0;i<S;i++) for(j=0;j<L;j++){ var c=matrix[i][j]; total+=c; if(c>max){ max=c; hi=i; hj=j; } }
  for(i=0;i<Math.min(S,L);i++) diag+=matrix[i][i];
  return {matrix:matrix,stage2:stage2,ratio:max/mean,maxCell:max,meanCell:mean,total:total,hotI:hi,hotJ:hj,diagShare:100*diag/N};
}
function pageECMP(){
  var h='<div class="page-head"><h1>ECMP hash polarization visualizer</h1><p class="lede">ECMP spreads flows across equal-cost paths by hashing each packet\'s 5-tuple — but when every switch in a Clos fabric runs the same hash with the same seed, the choices stop being independent and traffic polarizes onto a few hot paths. Run the simulation and watch it happen, then flip the seed mode and watch it heal.</p></div>'

  +'<div class="card panel"><h3>Your fabric</h3>'
  +'<div class="grid-2"><div class="field"><label for="ec-s">Spines (S)</label><input id="ec-s" type="number" min="2" max="32" step="1" value="8"></div>'
  +'<div class="field"><label for="ec-l">Leaves (L)</label><input id="ec-l" type="number" min="2" max="32" step="1" value="8"></div></div>'
  +'<div class="field" style="margin-top:.9rem"><label for="ec-n">Flows (N)</label><input id="ec-n" type="number" min="1000" max="100000" step="100" value="10000"></div>'
  +'<div class="field" style="margin-top:.9rem"><label>Hash seed mode</label><div class="seg" id="ec-seg" role="group" aria-label="Hash seed mode"><button type="button" id="ec-ident" aria-pressed="true">Identical seed on every switch</button><button type="button" id="ec-varied" aria-pressed="false">Per-switch varied seeds</button></div></div>'
  +'<div style="margin-top:1rem"><button type="button" class="btn" id="ec-run">Run simulation</button></div>'
  +'<div id="ec-err" class="err" role="alert" style="margin-top:.6rem"></div></div>'
  +'<div class="card panel"><h3>How the load landed</h3>'
  +'<div class="stat-strip"><div class="stat"><span class="v" id="ec-ratio">—</span><span class="l">Polarization ratio (max ÷ mean cell)</span></div>'
  +'<div class="stat"><span class="v" id="ec-max">—</span><span class="l">Hottest path-pair cell</span></div>'
  +'<div class="stat"><span class="v" id="ec-mean">—</span><span class="l">Mean cell load (N ÷ S×L)</span></div>'
  +'<div class="stat"><span class="v" id="ec-flows">—</span><span class="l">Flows simulated</span></div></div>'
  +'<div id="ec-verdict" aria-live="polite"></div>'
  +'<dl class="kv" id="ec-out" aria-live="polite"></dl>'
  +'<h3 style="margin-top:1.4rem">Stage-2 load per leaf link</h3>'
  +'<p style="color:var(--muted);font-size:.9rem;margin:.2rem 0 0">Flows by the spine→leaf link they left on. The amber tick marks the perfectly even share (N ÷ L).</p>'
  +'<div class="ec-bars" id="ec-bars"></div>'
  +'<h3 style="margin-top:1.4rem">Joint distribution: stage-1 × stage-2</h3>'
  +'<p style="color:var(--muted);font-size:.9rem;margin:.2rem 0 0">Rows are the stage-1 link (leaf → spine), columns the stage-2 link (spine → leaf); each cell counts flows that took that exact pair of links. A healthy fabric fills the whole grid evenly. Polarization lights up a diagonal: stage-1 link <i>i</i> feeding only stage-2 link <i>i</i>, so the other S×L − S path pairs carry nothing. Hover any cell for its exact count.</p>'
  +'<div class="ec-heat" id="ec-heat"></div>'
  +'</div>'
  +'</div>'
  +'<div class="card panel" style="margin-top:1.4rem"><h3 style="margin-top:0">What polarization is, and how fabrics avoid it</h3>'
  +'<ul><li><b>ECMP picks a path by hashing the 5-tuple.</b> Source and destination IP, source and destination port, and protocol go into a hash; the result modulo the link count chooses the next hop. Same flow, same hash, same path — that stability is the point, because it keeps a flow\'s packets in order.</li>'
  +'<li><b>Identical seeds make the stages agree — and that is the bug.</b> In a two-stage Clos, a flow is hashed once at the leaf (choosing a spine) and again at the spine (choosing a leaf). If both switches hash the same 5-tuple with the same seed, the second hash returns the same number as the first. Stage-1 link <i>i</i> then pairs almost exclusively with stage-2 link <i>i</i>: traffic collapses onto the diagonal of the matrix above, a handful of path pairs carry everything, and the rest of the fabric idles while those links congest. Switch the seed mode above and compare the two heatmaps — same flows, same fabric, completely different outcome.</li>'
  +'<li><b>The standard fixes all attack the correlation.</b> Per-switch (or per-stage) hash seed variation is the baseline: a different seed per device makes each stage\'s choice independent, which is the varied-seed mode simulated here. Resilient (consistent) hashing keeps flow-to-link assignments stable when a link fails, so a failure remaps only the dead link\'s flows instead of reshuffling the whole fabric. Flowlets re-balance at natural gaps in a flow, spraying bursts across paths without reordering packets. Symmetric hashing makes both directions of a conversation follow the same path, which stateful middleboxes and latency-sensitive fabrics care about.</li>'
  +'<li><b>An honest note on the hash itself.</b> A seed only helps if changing it actually decorrelates the output. This tool hashes with FNV-1a, whose low bits — the bits the modulo reads — barely respond to a change in the initial seed, so raw FNV-1a would leave the two stages correlated even with different seeds. The hash here is therefore finished with the MurmurHash3 fmix32 avalanche, which mixes every input bit into every output bit; that is what lets the varied-seed mode spread. Real switch ASICs use CRC- or Toeplitz-family hashes with proper avalanche for the same reason — when you evaluate a platform, "configurable seed" is only half the question; the hash has to mix.</li></ul>'
  +'<p style="color:var(--muted);font-size:.92rem">Size the fabric itself in the <a href="https://allaboutitinfrastructure.com/#/tools/dcap">data-center capacity planner</a>, read the <a href="https://allaboutitinfrastructure.com/#/article/hyperscaler-career-path">Hyperscaler career guide</a> for where Clos design lives on the job, then work the full <a href="https://allaboutitinfrastructure.com/#/track/hyperscaler">Hyperscaler track</a>.</p></div>'
  +'<div style="margin-top:1.6rem">'+toolRows()+'</div>';
  document.getElementById("tool").innerHTML=h; document.title="ECMP Hash Polarization Visualizer | Packet Path";
  initECMP();
}
function initECMP(){
  var varied=false, runNo=0;
  function v(id){ return parseFloat($("#"+id).value); }
  function setMode(x){
    varied=x;
    $("#ec-ident").setAttribute("aria-pressed",String(!x));
    $("#ec-varied").setAttribute("aria-pressed",String(x));
  }
  function run(){
    $("#ec-err").textContent=""; $("#ec-verdict").innerHTML="";
    var S=v("ec-s"), L=v("ec-l"), N=v("ec-n");
    if(isNaN(S)||S%1!==0||S<2||S>32){ $("#ec-err").textContent="Spines must be a whole number from 2 to 32."; return; }
    if(isNaN(L)||L%1!==0||L<2||L>32){ $("#ec-err").textContent="Leaves must be a whole number from 2 to 32."; return; }
    if(isNaN(N)||N%1!==0||N<1000||N>100000){ $("#ec-err").textContent="Flows must be a whole number from 1,000 to 100,000."; return; }
    var r=ecmpSim(S,L,N,varied,0x2545F491+runNo*7919); runNo++;
    var ratioEl=$("#ec-ratio");
    ratioEl.textContent=r.ratio.toFixed(2)+"×";
    ratioEl.className="v "+(r.ratio<1.5?"ec-good":(r.ratio>2?"ec-bad":"ec-mid"));
    $("#ec-max").textContent=comma(r.maxCell);
    $("#ec-mean").textContent=r.meanCell.toLocaleString("en-US",{maximumFractionDigits:1});
    $("#ec-flows").textContent=comma(N);
    var verdict;
    if(r.ratio<1.5) verdict='<div class="callout key" style="margin:0"><strong class="t">Healthy — near-uniform spreading</strong>The hottest path pair carries '+r.ratio.toFixed(2)+'× the mean cell load. Every stage-1 → stage-2 combination is in use, so the fabric\'s full bisection is available to this traffic.</div>';
    else if(r.ratio>2) verdict='<div class="callout" style="margin:0;border-left-color:#b3261e;border-color:#b3261e"><strong class="t" style="color:#b3261e">Polarized — traffic is collapsing onto a few paths</strong>The hottest path pair carries '+r.ratio.toFixed(2)+'× the mean cell load, and '+r.diagShare.toFixed(1)+'% of all flows sit on the diagonal. Those links congest while most of the fabric idles — the classic identical-seed failure. Flip to per-switch varied seeds and run it again.</div>';
    else verdict='<div class="callout warn" style="margin:0"><strong class="t">Uneven — mild polarization</strong>The hottest path pair carries '+r.ratio.toFixed(2)+'× the mean cell load. Not a collapse, but the hot links will queue first under load; check seed configuration before blaming capacity.</div>';
    $("#ec-verdict").innerHTML=verdict;
    var rows=[];
    rows.push(["Seed mode",varied?"Per-switch varied seeds":"Identical seed on every switch"]);
    rows.push(["Fabric",S+" spines × "+L+" leaves ("+(S*L)+" path pairs)"]);
    rows.push(["Hottest path pair","Stage-1 link "+(r.hotI+1)+" → stage-2 link "+(r.hotJ+1)+" — "+comma(r.maxCell)+" flows"]);
    rows.push(["Diagonal traffic share",r.diagShare.toFixed(1)+"% of flows"]);
    rows.push(["Polarization ratio",r.ratio.toFixed(2)+"× (max cell ÷ mean cell)"]);
    $("#ec-out").innerHTML=rows.map(function(x){return "<dt>"+x[0]+"</dt><dd>"+x[1]+"</dd>";}).join("");
    var maxS2=0,j;
    for(j=0;j<L;j++) if(r.stage2[j]>maxS2) maxS2=r.stage2[j];
    var even=N/L;
    $("#ec-bars").innerHTML=r.stage2.map(function(c,j){
      var w=maxS2?(100*c/maxS2):0, ew=maxS2?(100*even/maxS2):0;
      return '<div class="ec-bar"><span class="lab">Leaf link '+(j+1)+'</span><span class="tr"><span class="fl" style="width:'+w.toFixed(1)+'%"></span><span class="exp" style="left:'+ew.toFixed(1)+'%"></span></span><span class="n">'+comma(c)+' ('+(100*c/N).toFixed(1)+'%)</span></div>';
    }).join("");
    var showNums=L<=16;
    var heat='<span class="ec-ax"></span>';
    for(j=0;j<L;j++) heat+='<span class="ec-ax">'+(j+1)+'</span>';
    for(var i=0;i<S;i++){
      heat+='<span class="ec-ax">'+(i+1)+'</span>';
      for(j=0;j<L;j++){
        var c=r.matrix[i][j], inten=r.maxCell?(c/r.maxCell):0;
        heat+='<span class="ec-cell" title="Stage-1 link '+(i+1)+' → stage-2 link '+(j+1)+': '+comma(c)+' flows ('+(100*c/N).toFixed(1)+'% of all flows)"><span class="ec-fill" style="opacity:'+inten.toFixed(3)+'"></span>'+(showNums?'<span class="n">'+c+'</span>':'')+'</span>';
      }
    }
    var heatEl=$("#ec-heat");
    heatEl.style.gridTemplateColumns="auto repeat("+L+",minmax(0,1fr))";
    heatEl.innerHTML=heat;
  }
  $("#ec-ident").addEventListener("click",function(){ setMode(false); run(); });
  $("#ec-varied").addEventListener("click",function(){ setMode(true); run(); });
  $("#ec-run").addEventListener("click",run);
  ["ec-s","ec-l","ec-n"].forEach(function(id){ $("#"+id).addEventListener("input",run); });
  run();
}


pageECMP();
</script>
