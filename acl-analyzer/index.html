function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function $(sel, el){ return (el||document).querySelector(sel); }

var IP={
 parse:function(s){
   s=String(s||"").trim();
   var m=s.split(".");
   if(m.length!==4) return {ok:false,err:"Enter 4 octets, e.g. 192.168.1.10"};
   var out=0;
   for(var i=0;i<4;i++){

   }

 },

var ACL_PORT_NAMES={www:80,https:443,telnet:23,ssh:22,ftp:21,"ftp-data":20,smtp:25,domain:53,pop3:110,ntp:123,snmp:161,bgp:179,kerberos:88,ldap:389,gopher:70,finger:79,"netbios-ns":137,"netbios-dgm":138,"netbios-ss":139};
function aclPortVal(tok){
  if(tok===undefined||tok===null) return null;
  if(/^\d+$/.test(tok)){ var v=parseInt(tok,10); return (v>=0&&v<=65535)?v:null; }
  var p=ACL_PORT_NAMES[String(tok).toLowerCase()];
  return (p===undefined)?null:p;
}
function aclParseAddr(toks,i){
  var t=(toks[i]||"").toLowerCase();
  if(t==="any"||t==="any4") return {range:[0,4294967295],next:i+1};
  if(t==="host"){
    var hr=IP.parse(toks[i+1]||"");
    if(!hr.ok) return null;
    return {range:[hr.val,hr.val],next:i+2};
  }
  var a=IP.parse(toks[i]||"");
  if(!a.ok) return null;
  var w=IP.parse(toks[i+1]||"");

}
function aclParsePortOp(toks,i){
  var op=(toks[i]||"").toLowerCase();
  if(op==="eq"){ var p=aclPortVal(toks[i+1]); if(p===null) return {ports:[0,65535],next:i+2,note:true}; return {ports:[p,p],next:i+2,note:false}; }

function aclParseLine(raw){
  var toks=raw.split(/\s+/).filter(function(x){return x!=="";});
  if(!toks.length) return {skip:true};
  var i=0, first=toks[0].toLowerCase();
  if(first.charAt(0)==="!") return {skip:true};

    if((toks[i+2]||"").toLowerCase()==="remark") return {skip:true};
    i+=2;
  }
  var action=(toks[i]||"").toLowerCase();
  if(action!=="permit"&&action!=="deny") return {unparsed:true};

function aclParse(text){
  var rules=[], skipped=[];

    out.push(res);
  });
  return {results:out,counts:counts};
}

function pageACL(){
  var sample="access-list 101 permit tcp any any eq 80\naccess-list 101 deny tcp 10.0.0.0 0.255.255.255 any eq 80\naccess-list 101 permit tcp 10.1.0.0 0.0.255.255 any eq 80\naccess-list 101 permit ip any any";
  var h='<div class="page-head"><h1>Firewall ACL rule analyzer</h1><p class="lede">Paste a Cisco IOS extended ACL and this page reads it the way the firewall does — top-down, first match wins — and flags the rules that can never fire, the duplicates that add nothing, and the one line that quietly opens everything.</p></div>'
  +'<div class="tool-shell">'
  +'<div class="card panel"><h3>Paste your ACL</h3>'
  +'<div class="field"><label for="acl-in">Cisco IOS extended ACL (IPv4)</label><textarea id="acl-in" rows="12" spellcheck="false" autocomplete="off">'+esc(sample)+'</textarea></div>'
  +'<div style="margin-top:.9rem"><button type="button" class="btn" id="acl-run">Analyze</button></div>'
  +'<p style="color:var(--muted);font-size:.88rem;margin:.8rem 0 0">Numbered extended ACLs (<code class="inline">access-list 101 …</code>) and bare <code class="inline">permit</code>/<code class="inline">deny</code> lines from a named ACL both parse. The analysis runs locally — your ACL never leaves this page.</p>'
  +'<div id="acl-err" class="err" role="alert" style="margin-top:.6rem"></div></div>'
  +'<div class="card panel"><h3>Findings</h3>'
  +'<div class="stat-strip"><div class="stat"><span class="v" id="acl-sh">—</span><span class="l">Shadowed</span></div>'
  +'<div class="stat"><span class="v" id="acl-rd">—</span><span class="l">Redundant</span></div>'
  +'<div class="stat"><span class="v" id="acl-br">—</span><span class="l">Overly broad</span></div>'
  +'<div class="stat"><span class="v" id="acl-cl">—</span><span class="l">Clean</span></div></div>'
  +'<div id="acl-findings" aria-live="polite"></div>'
  +'</div>'
  +'</div>'
  +'<div class="card panel" style="margin-top:1.4rem"><h3 style="margin-top:0">Shadowed, redundant, and wide open — what the findings mean</h3>'
  +'<ul><li><b>Shadowed vs redundant: both are dead rules, but only one is lying to you.</b> A rule is <b>shadowed</b> when an earlier rule with the <i>opposite</i> action already matches every packet it could ever see — the config says "deny this" while the wire says "permit," and the rule\'s hit counter will sit at zero forever. A rule is <b>redundant</b> when an earlier rule with the <i>same</i> action already covers it completely: delete it and the firewall behaves identically, so all it adds is lookup cost and audit noise. This analyzer only reports full containment — a rule half-covered by two different earlier rules is a subtler failure, and partial overlaps are deliberately not flagged as findings.</li>'
  +'<li><b>Why dead rules accumulate.</b> Rules get added under incident pressure and removed never. Subnets get re-carved, so last year\'s narrow exception ends up inside this year\'s broad permit. Firewall migrations concatenate two devices\' policies and inherit both. A "temporary" troubleshooting permit outlives the project it was opened for. Every firewall older than a few years carries rules nobody can explain — each one is either drag or a lie, and you cannot tell which without reading the policy top-down exactly the way the hardware does.</li>'
  +'<li><b><code class="inline">permit ip any any</code> turns the firewall off for everything the denies above it miss.</b> Every protocol, every port, any source to any destination — if that line sits above your cleanup deny, the only traffic still being filtered is whatever an earlier explicit deny happens to catch. It almost always arrives as a 2 a.m. troubleshooting step ("just open it up — is the firewall even the problem?") and then never leaves. If you genuinely need a broad permit, scope it: one protocol, named networks, and logging on, so at least the hole is visible in the logs.</li>'
  +'<li><b>Parser scope, honestly stated.</b> This reads numbered extended IOS ACLs (<code class="inline">access-list 101 …</code>) and bare <code class="inline">permit</code>/<code class="inline">deny</code> lines, IPv4 only. Wildcard masks are applied bit-for-bit per octet (discontiguous masks included), and <code class="inline">eq</code>, <code class="inline">range</code>, <code class="inline">gt</code>, and <code class="inline">lt</code> port operators are modeled. <code class="inline">neq</code> and unrecognized port operators are treated as the full port range, and the rule is flagged with a note. Not modeled: object-groups and port groups (expand them before pasting), <code class="inline">time-range</code> schedules (a time-ranged rule is treated as always on), ICMP type/code detail, <code class="inline">established</code>, NAT and route-map interactions, and ASA/FTD syntax. Protocol <code class="inline">ip</code> is correctly treated as covering tcp, udp, and icmp when checking whether one rule contains another.</li></ul>'
  +'<p style="color:var(--muted);font-size:.92rem">Firewall policy is daily work on the <a href="https://allaboutitinfrastructure.com/#/track/enterprise">Enterprise track</a>; the <a href="https://allaboutitinfrastructure.com/#/article/enterprise-career-path">Enterprise Network Engineer career guide</a> covers where security policy sits in the role, and the <a href="https://allaboutitinfrastructure.com/#/tools/sla">SLA calculator</a> is handy for pricing the change window when you clean the dead rules out.</p></div>'
  +'<div style="margin-top:1.6rem">'+toolRows()+'</div>';
  document.getElementById("tool").innerHTML=h; document.title="Firewall ACL Rule Analyzer | Packet Path";
  initACL();
}
function initACL(){
  function badge(st){
    if(st==="shadowed") return '<span class="acl-badge sh">Shadowed</span>';
    if(st==="redundant") return '<span class="acl-badge rd">Redundant</span>';
    if(st==="broad") return '<span class="acl-badge br">Overly broad</span>';
    return '<span class="acl-badge ok">Clean</span>';
  }
  function run(){
    $("#acl-err").textContent="";
    var parsed=aclParse($("#acl-in").value);
    var rules=parsed.rules;
    var a=aclAnalyze(rules);
    $("#acl-sh").textContent=String(a.counts.shadowed);
    $("#acl-rd").textContent=String(a.counts.redundant);
    $("#acl-br").textContent=String(a.counts.broad);
    $("#acl-cl").textContent=String(a.counts.clean);
    var html="";
    if(!rules.length){
      html='<p style="color:var(--muted)">No extended ACL rules found yet. Paste lines like <code class="inline">access-list 101 permit tcp any any eq 443</code> and the findings land here.</p>';
    } else {
      html='<div class="acl-findings">'+rules.map(function(r,i){
        var res=a.results[i], why="";
        if(res.status==="shadowed") why='Shadowed by rule '+res.by.join(", rule ")+': every packet this '+r.action+' rule could match is already matched earlier with the opposite action, so this line can never fire — the intent it documents is not what the firewall enforces.';
        else if(res.status==="redundant") why='Fully covered by rule '+res.by.join(", rule ")+' with the same action. Delete it and the firewall behaves identically — it only adds lookup cost and audit noise.';
        else if(res.status==="broad") why='This permits every protocol, from any source, to any destination. Anything not explicitly denied above it is open — see the explainer below.';
        else why='Reachable, and doing work no earlier rule already does for it.';
        var note=r.note?'<p class="why" style="color:var(--muted)">Note: this line uses <code class="inline">neq</code> or an unrecognized port operator, which this analyzer treats as the full port range — findings involving this rule are approximate.</p>':"";
        return '<div class="acl-row"><div class="acl-head"><span class="rn">Rule '+(i+1)+'</span>'+badge(res.status)+'</div><code>'+esc(r.raw)+'</code><p class="why">'+why+'</p>'+note+'</div>';
      }).join("")+'</div>';
    }
    if(parsed.skipped.length){
      html+='<p style="color:var(--muted);font-size:.88rem;margin-top:.9rem">'+parsed.skipped.length+' line'+(parsed.skipped.length===1?"":"s")+' could not be parsed as an extended ACL rule and '+(parsed.skipped.length===1?"was":"were")+' skipped:</p><pre class="code"><code>'+esc(parsed.skipped.join("\n"))+'</code></pre>';
    }
    $("#acl-findings").innerHTML=html;
  }
  $("#acl-run").addEventListener("click",run);
  $("#acl-in").addEventListener("input",run);
  run();
}


pageACL();
</script>
</body>
</html>
